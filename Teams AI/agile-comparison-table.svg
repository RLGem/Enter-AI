<svg width="100%" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff;">
<title>Agile traditional vs hybrid comparison</title>

<style>
  .hdr { font-size: 14px; font-weight: 500; }
  .cat { font-size: 11px; font-weight: 500; fill: #5F5E5A; }
  .body { font-size: 12px; font-weight: 400; fill: #2C2C2A; }
  .accent { font-size: 12px; font-weight: 500; fill: #534AB7; }
  .dim { font-size: 12px; font-weight: 400; fill: #888780; }
</style>

<!-- Table outline -->
<rect x="10" y="10" width="880" height="660" rx="12" fill="none" stroke="#D3D1C7" stroke-width="1"/>

<!-- Header row -->
<rect x="10" y="10" width="110" height="44" rx="0" fill="#F1EFE8"/>
<rect x="120" y="10" width="370" height="44" fill="#F1EFE8"/>
<rect x="490" y="10" width="400" height="44" rx="0" fill="#EEEDFE"/>
<!-- Round top corners manually -->
<rect x="10" y="10" width="110" height="20" rx="12" fill="#F1EFE8"/>
<rect x="10" y="22" width="110" height="32" fill="#F1EFE8"/>
<rect x="830" y="10" width="60" height="20" rx="12" fill="#EEEDFE"/>
<rect x="490" y="10" width="400" height="20" fill="#EEEDFE"/>
<rect x="490" y="22" width="400" height="32" fill="#EEEDFE"/>

<line x1="10" y1="54" x2="890" y2="54" stroke="#B4B2A9" stroke-width="1.5"/>

<!-- Header text (RTL) -->
<text class="hdr" x="65" y="38" text-anchor="middle" fill="#444441" direction="rtl" unicode-bidi="bidi-override">תחום</text>
<text class="hdr" x="305" y="38" text-anchor="middle" fill="#444441">Agile מסורתי</text>
<text class="hdr" x="690" y="38" text-anchor="middle" fill="#3C3489">Agile היברידי</text>
<!-- "New" pill -->
<rect x="775" y="25" width="40" height="20" rx="10" fill="#CECBF6"/>
<text x="795" y="38" text-anchor="middle" font-size="10" font-weight="500" fill="#3C3489">חדש</text>

<!-- Row separator lines -->
<line x1="10" y1="130" x2="890" y2="130" stroke="#E8E6DF" stroke-width="0.5"/>
<line x1="10" y1="206" x2="890" y2="206" stroke="#E8E6DF" stroke-width="0.5"/>
<line x1="10" y1="282" x2="890" y2="282" stroke="#E8E6DF" stroke-width="0.5"/>
<line x1="10" y1="358" x2="890" y2="358" stroke="#E8E6DF" stroke-width="0.5"/>
<line x1="10" y1="434" x2="890" y2="434" stroke="#E8E6DF" stroke-width="0.5"/>
<line x1="10" y1="510" x2="890" y2="510" stroke="#E8E6DF" stroke-width="0.5"/>
<line x1="10" y1="586" x2="890" y2="586" stroke="#E8E6DF" stroke-width="0.5"/>

<!-- Column separators -->
<line x1="120" y1="10" x2="120" y2="670" stroke="#E8E6DF" stroke-width="0.5"/>
<line x1="490" y1="10" x2="490" y2="670" stroke="#D3D1C7" stroke-width="1"/>

<!-- Category column bg -->
<rect x="10" y="54" width="110" height="616" fill="#FAFAF8"/>
<!-- Hybrid column subtle bg -->
<rect x="490" y="54" width="400" height="616" fill="rgba(238,237,254,0.15)"/>
<!-- Bottom rounded corners -->
<rect x="10" y="650" width="110" height="20" rx="12" fill="#FAFAF8"/>
<rect x="10" y="650" width="110" height="10" fill="#FAFAF8"/>
<rect x="830" y="650" width="60" height="20" rx="12" fill="rgba(238,237,254,0.15)"/>

<!-- Row 1: Daily standup -->
<text class="cat" x="65" y="88" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Daily</text>
<text class="cat" x="65" y="102" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">standup</text>
<text class="body" x="300" y="88" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">סנכרון עם הצוות</text>
<text class="body" x="300" y="106" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">האנושי בלבד</text>
<text class="body" x="690" y="80" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">סנכרון שכולל</text>
<text class="accent" x="690" y="98" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">עדכון סטטוס מאייג'נטים</text>
<text class="accent" x="690" y="116" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">persistent</text>

<!-- Row 2: Definition of Done -->
<text class="cat" x="65" y="164" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Definition</text>
<text class="cat" x="65" y="178" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">of Done</text>
<text class="body" x="300" y="164" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">בדיקת קוד, טסטים,</text>
<text class="body" x="300" y="182" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">code review</text>
<text class="body" x="690" y="156" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">כל אלה +</text>
<text class="accent" x="690" y="174" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">בדיקת עקביות</text>
<text class="body" x="690" y="192" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">עם החלטות הארכיטקט</text>

<!-- Row 3: Sprint Retro -->
<text class="cat" x="65" y="240" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Sprint</text>
<text class="cat" x="65" y="254" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">retrospective</text>
<text class="body" x="300" y="240" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">סקירת תהליך</text>
<text class="body" x="300" y="258" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">העבודה האנושי</text>
<text class="body" x="690" y="232" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">כולל</text>
<text class="accent" x="690" y="250" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">סקירת context drift</text>
<text class="body" x="690" y="268" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">האם ה-knowledge base עדכני?</text>

<!-- Row 4: Scrum Master -->
<text class="cat" x="65" y="316" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Scrum</text>
<text class="cat" x="65" y="330" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Master</text>
<text class="body" x="300" y="322" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מסיר חסמים לצוות</text>
<text class="body" x="690" y="308" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">גם</text>
<text class="accent" x="690" y="326" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מוודא routing נכון</text>
<text class="body" x="690" y="344" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">לאייג'נט הנכון, לא חדש</text>

<!-- Row 5: Product Owner -->
<text class="cat" x="65" y="392" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Product</text>
<text class="cat" x="65" y="406" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Owner</text>
<text class="body" x="300" y="392" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מגדיר</text>
<text class="body" x="300" y="410" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">User Stories</text>
<text class="body" x="690" y="384" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מגדיר גם</text>
<text class="accent" x="690" y="402" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Agent Stories</text>
<text class="body" x="690" y="420" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מה כל אייג'נט צריך "לדעת"</text>

<!-- Row 6: Knowledge management -->
<text class="cat" x="65" y="462" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Knowledge</text>
<text class="cat" x="65" y="476" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">management</text>
<text class="dim" x="300" y="468" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">קונפלואנס, Wiki,</text>
<text class="dim" x="300" y="486" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">תיעוד סטטי</text>
<text class="accent" x="690" y="460" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Decision Log חי</text>
<text class="body" x="690" y="478" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">שמתעדכן אוטומטית</text>
<text class="body" x="690" y="496" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מכל אינטראקציה</text>

<!-- Row 7: Code consistency -->
<text class="cat" x="65" y="540" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Code</text>
<text class="cat" x="65" y="554" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">consistency</text>
<text class="body" x="300" y="544" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Coding standards</text>
<text class="body" x="300" y="562" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">ו-linting</text>
<text class="body" x="690" y="536" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">כל אלה +</text>
<text class="accent" x="690" y="554" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מקור אמת אחד</text>
<text class="body" x="690" y="572" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">לכל הכלים</text>

<!-- Row 8: Onboarding -->
<text class="cat" x="65" y="620" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">Onboarding</text>
<text class="body" x="300" y="618" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מנטורינג אנושי,</text>
<text class="body" x="300" y="636" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">קריאת תיעוד</text>
<text class="body" x="690" y="610" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מפתח חדש</text>
<text class="accent" x="690" y="628" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">מתחבר לצוות האייג'נטים</text>
<text class="body" x="690" y="646" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override">ומקבל גישה מיידית להקשר</text>

</svg>