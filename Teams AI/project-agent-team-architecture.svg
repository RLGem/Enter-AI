<svg width="100%" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff;">
<title>Project Agent Team Architecture</title>
<desc>Architecture diagram showing the Project Intelligence Layer — persistent specialist agents, smart routing, and shared decision log — sitting between human development teams and standard protocols.</desc>

<style>
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .t  { font-size: 14px; font-weight: 400; }
</style>

<!-- === TOP: Human dev teams === -->
<text class="th" x="340" y="36" text-anchor="middle" fill="#2C2C2A">Human development teams</text>

<!-- Developer A -->
<rect x="40" y="52" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="105" y="72" text-anchor="middle" dominant-baseline="central" fill="#444441">Developer A</text>
<text class="ts" x="105" y="92" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Claude Code</text>

<!-- Developer B -->
<rect x="190" y="52" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="255" y="72" text-anchor="middle" dominant-baseline="central" fill="#444441">Developer B</text>
<text class="ts" x="255" y="92" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Cursor</text>

<!-- QA engineer -->
<rect x="340" y="52" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="405" y="72" text-anchor="middle" dominant-baseline="central" fill="#444441">QA engineer</text>
<text class="ts" x="405" y="92" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Copilot</text>

<!-- UX designer -->
<rect x="490" y="52" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="565" y="72" text-anchor="middle" dominant-baseline="central" fill="#444441">UX designer</text>
<text class="ts" x="565" y="92" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Gemini Code Assist</text>

<!-- Arrows from humans down -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="105" y1="108" x2="105" y2="160" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="255" y1="108" x2="255" y2="160" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="405" y1="108" x2="405" y2="160" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="565" y1="108" x2="565" y2="160" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- === MAIN CONTAINER: Project Intelligence Layer === -->
<rect x="24" y="168" width="632" height="440" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="198" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Project Intelligence Layer</text>

<!-- Smart routing -->
<rect x="50" y="216" width="580" height="52" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text class="th" x="340" y="242" text-anchor="middle" dominant-baseline="central" fill="#72243E">Smart routing — routes queries to the right specialist</text>

<!-- Arrows from routing to agents -->
<line x1="145" y1="268" x2="145" y2="310" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="310" y1="268" x2="310" y2="310" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470" y1="268" x2="470" y2="310" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Persistent specialist agents -->
<rect x="50" y="316" width="180" height="74" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="140" y="342" text-anchor="middle" dominant-baseline="central" fill="#085041">Architect agent</text>
<text class="ts" x="140" y="362" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Persistent identity</text>
<text class="ts" x="140" y="378" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Accumulates decisions</text>

<rect x="250" y="316" width="180" height="74" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="342" text-anchor="middle" dominant-baseline="central" fill="#085041">DBA agent</text>
<text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Persistent identity</text>
<text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Schema + indexes</text>

<rect x="450" y="316" width="180" height="74" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="540" y="342" text-anchor="middle" dominant-baseline="central" fill="#085041">QA lead agent</text>
<text class="ts" x="540" y="362" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Persistent identity</text>
<text class="ts" x="540" y="378" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Test strategy</text>

<!-- Bidirectional arrows agents <-> decision log -->
<line x1="140" y1="390" x2="140" y2="440" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="160" y1="440" x2="160" y2="390" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="330" y1="390" x2="330" y2="440" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="440" x2="350" y2="390" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="530" y1="390" x2="530" y2="440" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="440" x2="550" y2="390" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Shared Decision Log -->
<rect x="50" y="448" width="580" height="76" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="476" text-anchor="middle" dominant-baseline="central" fill="#712B13">Shared decision log — living memory</text>
<text class="ts" x="340" y="498" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Every decision, trade-off, and constraint — auto-updated from every interaction</text>

<!-- Protocol layer -->
<line x1="230" y1="524" x2="187" y2="542" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="524" x2="492" y2="542" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="544" width="275" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="187" y="570" text-anchor="middle" dominant-baseline="central" fill="#444441">MCP — tool access</text>

<rect x="355" y="544" width="275" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="492" y="570" text-anchor="middle" dominant-baseline="central" fill="#444441">A2A — agent coordination</text>

<!-- === BOTTOM: Key properties legend === -->
<text class="th" x="340" y="650" text-anchor="middle" fill="#2C2C2A">Key properties</text>

<rect x="40" y="664" width="140" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="110" y="684" text-anchor="middle" dominant-baseline="central" fill="#085041">Persistent identity</text>

<rect x="200" y="664" width="120" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="260" y="684" text-anchor="middle" dominant-baseline="central" fill="#712B13">Living memory</text>

<rect x="340" y="664" width="130" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text class="ts" x="405" y="684" text-anchor="middle" dominant-baseline="central" fill="#72243E">Smart routing</text>

<rect x="490" y="664" width="150" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="565" y="684" text-anchor="middle" dominant-baseline="central" fill="#444441">Tool-agnostic layer</text>

</svg>